[package]
name = "guo"
version = "0.1.0"
edition = "2021"
description = "guoapp — 红果短剧命令行工具（Rust 重写）：目录 / 搜索 / 取流 / 下载"

[dependencies]
ureq = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
md-5 = "0.10"
sha2 = "0.10"
hex = "0.4"
aes = "0.8"
cbc = "0.1"
base64 = "0.22"
url = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = "z"
