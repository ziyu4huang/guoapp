[package]
name = "guo"
version = "0.6.0"
edition = "2021"
description = "guoapp — 红果短剧工具（Rust 重写）：CLI + 原生 GUI（egui），目录 / 搜索 / 取流 / 下载"

[dependencies]
mimalloc = "0.1"
ureq = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
pbkdf2 = "0.12"
hmac = "0.12"
sha1 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
md-5 = "0.10"
sha2 = "0.10"
hex = "0.4"
aes = "0.8"
cbc = "0.1"
base64 = "0.22"
url = "2"
eframe = "=0.31.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }

[lib]
name = "guo"
path = "src/lib.rs"

[[bin]]
name = "guo"
path = "src/main.rs"

[[bin]]
name = "guo-gui"
path = "src/bin/guo-gui.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = "z"

[dev-dependencies]
accesskit = "0.17"
egui = "0.31"
egui_kittest = { version = "0.31", features = ["eframe", "wgpu"] }
